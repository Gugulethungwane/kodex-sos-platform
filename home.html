<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHUSELA - Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;display:flex;justify-content:center;align-items:center;min-height:100vh;color:white;font-family:'Segoe UI',sans-serif}
.phone{width:390px;background:linear-gradient(180deg,#251840,#15101f 45%,#0e0e14 100%);border-radius:36px;padding:22px 18px;border:1px solid rgba(255,50,100,0.25);box-shadow:0 0 80px rgba(255,0,80,0.2)}
.header{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;opacity:.55;font-weight:700}
.title{text-align:center;margin:24px 0 8px;font-size:34px;letter-spacing:3px;font-weight:900}
.live{text-align:center;color:#2eff7a;font-size:9px;letter-spacing:1.6px;font-weight:800}
.live::before{content:"● ";animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.help-wrap{display:flex;justify-content:center;margin:36px 0 18px;position:relative}
.help-wrap::after{content:"";position:absolute;width:260px;height:260px;background:rgba(255,0,80,.22);filter:blur(35px);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);z-index:0}
#helpBtn{width:192px;height:192px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#ff6b95,#ff003c 55%,#7a0020);border:3px solid rgba(255,200,210,.7);box-shadow:0 0 35px rgba(255,0,64,.7), inset 0 0 25px rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;cursor:pointer;user-select:none;transition:.1s}
#helpBtn:active{transform:scale(.96);box-shadow:0 0 55px rgba(255,0,64,1)}
#helpBtn b{font-size:38px;font-weight:900;letter-spacing:1px}
#helpBtn small{font-size:9px;font-weight:700;opacity:.9;letter-spacing:.5px;margin-top:3px}
.hint{text-align:center;font-size:9.5px;letter-spacing:1px;opacity:.4;font-weight:700;margin-bottom:20px}
.gps{background:rgba(255,255,255,.06);border:1px solid rgba(255,80,120,.18);border-radius:16px;padding:12px 14px}
.gps b{font-size:9.5px;letter-spacing:.8px}
.gps span{display:block;font-size:9.5px;opacity:.7;margin-top:2px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.act{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:12px 2px;text-align:center;font-size:8.5px;font-weight:800;cursor:pointer}
.act i{font-style:normal;display:block;font-size:15px;margin-bottom:3px}
#progress{position:absolute;top:-6px;left:-6px;width:204px;height:204px;border-radius:50%;transform:rotate(-90deg);pointer-events:none}
#progress circle{fill:none;stroke:#ff003c;stroke-width:4;stroke-dasharray:628;stroke-dashoffset:628;transition:.1s linear}
</style>
</head>
<body>
<div class="phone">
  <div class="header"><span>🔵 KHUSELA</span><span>● SYSTEM ARMED</span></div>
  <h1 class="title">EMERGENCY SOS</h1>
  <p class="live">LIVE PROTECTION ACTIVE</p>
  <div class="help-wrap">
    <svg id="progress"><circle cx="102" cy="102" r="100"/></svg>
    <div id="helpBtn"><b>HELP</b><small>HOLD FOR 3 SECONDS</small></div>
  </div>
  <p class="hint">TOUCH & HOLD FOR RAPID RESPONSE</p>
  <div class="gps">
    <b>LIVE GPS TRANSMISSION ENGAGED</b>
    <span id="coords">Getting location... [Tembisa]</span>
  </div>
  <div class="actions">
    <div class="act" onclick="openContacts()"><i>👥</i>CONTACTS</div>
    <div class="act" onclick="toggleSiren()"><i>🔊</i>SIREN</div>
    <div class="act" onclick="sendMessage()"><i>💬</i>MESSAGE</div>
    <div class="act" onclick="call112()"><i>📞</i>112</div>
  </div>
</div>

<script>
const btn=document.getElementById('helpBtn');
const circle=document.querySelector('#progress circle');
let timer,progress=0,holding=false;
let sirenAudio=null;

navigator.geolocation.getCurrentPosition(p=>{
  document.getElementById('coords').innerText=`LAT: ${p.coords.latitude.toFixed(4)}° LON: ${p.coords.longitude.toFixed(4)}° [Live]`;
},()=>{});

function startHold(e){
  e.preventDefault(); holding=true; progress=0;
  timer=setInterval(()=>{
    progress+=2.2;
    circle.style.strokeDashoffset=628-(628*progress/100);
    if(progress>=100){clearInterval(timer); triggerSOS()}
  },60);
}
function endHold(){holding=false; clearInterval(timer); if(progress<100){progress=0; circle.style.strokeDashoffset=628}}

function triggerSOS(){
  btn.innerHTML='<b>SENT!</b><small>HELP IS COMING</small>';
  btn.style.background='radial-gradient(circle,#00ff88,#00994d)';
  navigator.vibrate&&navigator.vibrate([200,100,200]);
  alert('🚨 SOS SENT!\nLocation shared to your emergency contacts.');
  setTimeout(()=>{btn.innerHTML='<b>HELP</b><small>HOLD FOR 3 SECONDS</small>'; btn.style.background=''; progress=0; circle.style.strokeDashoffset=628},3000);
}

btn.addEventListener('mousedown',startHold);
btn.addEventListener('touchstart',startHold);
window.addEventListener('mouseup',endHold);
window.addEventListener('touchend',endHold);

function toggleSiren(){
  if(sirenAudio&&!sirenAudio.paused){sirenAudio.pause(); alert('Siren OFF'); return}
  sirenAudio=new Audio('https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg'); sirenAudio.loop=true; sirenAudio.play(); alert('🔊 SIREN ON - LOUD!')
}
function sendMessage(){
  const c=document.getElementById('coords').innerText;
  const text=`KHUSELA EMERGENCY! I need help! ${c} https://maps.google.com/?q=${c}`;
  if(navigator.share){navigator.share({title:'KHUSELA SOS',text})}
  else{window.open(`https://wa.me/?text=${encodeURIComponent(text)}`)}
}
function call112(){window.location.href='tel:112'}
function openContacts(){const name=prompt('Emergency Contact Name:'); const num=prompt('Phone Number:'); if(name&&num){alert(`Saved: ${name} - ${num}`); localStorage.setItem('khusela_contact',`${name}:${num}`)}}
</script>
</body>
</html>
